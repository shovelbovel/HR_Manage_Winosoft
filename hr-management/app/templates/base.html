<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}HR Management{% endblock %}</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d9488'/%3E%3Ctext x='32' y='43' font-family='Arial, Helvetica, sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EHR%3C/text%3E%3C/svg%3E"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body data-flash="{{ request.query_params.get('flash', '') }}" data-flash-category="{{ request.query_params.get('flash_category', 'success') }}">
    {% if current_user %}
    <div class="app-shell">
      {% include "_sidebar.html" %}
      <main class="main-content">
    {% else %}
    <main class="d-flex flex-column min-vh-100">
    {% endif %}
      {% block content %}{% endblock %}
    </main>
    {% if current_user %}
    </div>
    {% endif %}

    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;" aria-live="polite" aria-atomic="true" id="toastContainer"></div>

    <div class="modal fade" id="confirmActionModal" tabindex="-1" aria-labelledby="confirmActionModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="confirmActionModalLabel">Confirmer l'action</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>
          <div class="modal-body" id="confirmActionModalBody">Êtes-vous sûr(e) ?</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="button" class="btn btn-danger" id="confirmActionModalConfirm">Confirmer</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
