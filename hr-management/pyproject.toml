[project]
name = "hr-management"
version = "0.1.0"
description = "HR Management backend (FastAPI + Firestore)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.12",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-jose[cryptography]>=3.3,<4",
    "bcrypt>=4.2,<5",
    "firebase-admin>=6.5,<7",
    "google-cloud-firestore>=2.19,<3",
    "email-validator>=2.2,<3",
    "weasyprint>=62,<63",
    # weasyprint 62.x's PDF backend calls a pydyf.Stream API that pydyf
    # 0.12+ removed/changed (AttributeError: 'super' object has no
    # attribute 'transform') — pin below the breaking release.
    "pydyf<0.12",
    "anthropic>=0.40,<1",
    "pypdf>=5.1,<6",
    "python-docx>=1.1,<2",
    # Attrition-risk model: runtime only needs to load a fitted pipeline
    # and score a row — pandas builds that row the same way the training
    # script does, so the exact preprocessing logic isn't duplicated.
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "pandas>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    # Training-only (ml/train_attrition_model.py) — never imported by the
    # running app, so it stays out of the prod image.
    "matplotlib>=3.9,<4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
