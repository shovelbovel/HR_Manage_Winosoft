services:
  firebase-emulators:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    volumes:
      - ./firebase.json:/srv/firebase.json:ro
      - ./firestore.rules:/srv/firestore.rules:ro
      - ./firestore.indexes.json:/srv/firestore.indexes.json:ro
      - ./storage.rules:/srv/storage.rules:ro
      # A named volume, not a host bind-mount: the emulator's export
      # deletes and recreates this directory on every export, and that
      # rmdir reliably fails with EBUSY on a Windows bind-mount (Docker
      # Desktop/WSL2 filesystem quirk) — a Docker-managed volume doesn't
      # have that limitation.
      - emulator-data:/srv/emulator-data
    ports:
      - "8080:8080" # Firestore
      - "9099:9099" # Auth (stood up per spec; unused by app logic yet — custom JWT)
      - "9199:9199" # Storage (stood up per spec; unused by app logic yet)
      - "4000:4000" # Emulator UI
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./ml:/app/ml
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - FIRESTORE_EMULATOR_HOST=firebase-emulators:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulators:9099
      - FIREBASE_STORAGE_EMULATOR_HOST=firebase-emulators:9199
      - GOOGLE_CLOUD_PROJECT=hr-management-dev
      - ENVIRONMENT=dev
    depends_on:
      firebase-emulators:
        condition: service_healthy

volumes:
  emulator-data:
